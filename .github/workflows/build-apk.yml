name: Build APK (debug-signed)

# Manual only. Stage 0: the mod/telegram-android.patch is empty and the
# components/ packages are stubs, so this builds vanilla Telegram-Android to
# prove the CI chain works end-to-end. Later stages add the actual mod.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PampGram-Android (patch + components)
        uses: actions/checkout@v4
        with:
          path: pampgram

      - name: Check out Telegram-Android
        run: |
          # Shallow + submodules. DrKLO/Telegram keeps a few native deps as
          # submodules (libwebp, libtgvoip, ffmpeg wrappers); without
          # --recursive the Gradle configuration fails on missing CMake sources.
          git clone --recursive --shallow-submodules --depth 1 -j8 \
            https://github.com/DrKLO/Telegram.git telegram-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Telegram-Android pins its NDK version inside TMessagesProj/build.gradle
      # (ndkVersion "..."). Read it NOW so setup-android below can install the
      # matching NDK itself — it handles the license prompt and doesn't trip on
      # the SIGPIPE that `yes | sdkmanager` produces under `set -o pipefail`.
      - name: Read Telegram-Android ndkVersion
        run: |
          set -euo pipefail
          NDK_VERSION=$(grep -E 'ndkVersion\s*' telegram-android/TMessagesProj/build.gradle \
            | head -n1 | sed -E 's/.*ndkVersion\s*=?\s*["'"'"']([^"'"'"']+)["'"'"'].*/\1/')
          if [ -z "$NDK_VERSION" ]; then
            echo "FAIL: could not read ndkVersion from TMessagesProj/build.gradle"
            exit 1
          fi
          echo "Telegram-Android pins NDK $NDK_VERSION"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up Android SDK (and the pinned NDK)
        uses: android-actions/setup-android@v3
        with:
          # The action's default `packages: 'tools platform-tools'` fails on
          # a current runner because the legacy `tools` package was removed
          # from Google's SDK repository (replaced by cmdline-tools, which
          # setup-android already installs on its own). Dropping `tools` from
          # the list is enough; Gradle auto-installs any build-tools and
          # platform versions it needs when it first runs. The NDK pinned by
          # Telegram-Android (read in the previous step) goes in here too so
          # setup-android handles the install and licenses in one place.
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Point ANDROID_NDK_HOME at the pinned NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # mod/components/* become whole new Java packages, dropped in as-is under
      # org.telegram.pampgram.*; mod/telegram-android.patch only touches files
      # that already exist upstream. Keeping the two apart means editing our
      # own Kotlin/Java never requires regenerating the patch.
      - name: Apply the PampGram patch
        working-directory: telegram-android
        env:
          CASINO_BRIDGE_URL: ${{ secrets.CASINO_BRIDGE_URL }}
          CASINO_BRIDGE_TOKEN: ${{ secrets.CASINO_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          # The patch is a plain unified diff with a header comment that
          # `git apply` tolerates. An empty-of-hunks patch is a no-op; a
          # malformed one fails --check loudly here instead of mid-build.
          if grep -q '^diff --git ' ../pampgram/mod/telegram-android.patch; then
            git apply --check ../pampgram/mod/telegram-android.patch
            git apply ../pampgram/mod/telegram-android.patch
          else
            echo "mod/telegram-android.patch has no diff hunks yet (stage 0); skipping apply."
          fi

          mkdir -p TMessagesProj/src/main/java/org/telegram/pampgram
          # Each component ships its Sources/ as a flat set of .java files; we
          # copy them into the target subpackage keyed by component name. The
          # mapping is explicit (not a lowercase-of-dirname) so the package
          # path and the iOS-mirroring component name can evolve independently.
          declare -A PAMPGRAM_COMPONENT_PACKAGE=(
            [PampGramCore]=core
            [PampGramSettingsUI]=settings
            [PhantomGiftKit]=gifts
          )
          for comp in ../pampgram/mod/components/*/Sources; do
            [ -d "$comp" ] || continue
            name=$(basename "$(dirname "$comp")")
            pkg="${PAMPGRAM_COMPONENT_PACKAGE[$name]:-}"
            if [ -z "$pkg" ]; then
              echo "FAIL: no package mapping for component '$name'; add it to PAMPGRAM_COMPONENT_PACKAGE."
              exit 1
            fi
            dest=TMessagesProj/src/main/java/org/telegram/pampgram/$pkg
            mkdir -p "$dest"
            cp -R "$comp"/. "$dest"/
            echo "component copied: $name -> $pkg"
          done

          python3 ../pampgram/mod/apply-profile-visuals.py
          python3 ../pampgram/mod/apply-settings-entry.py

          # Casino bridge: inject URL/token into the build copy only, never into
          # git. Mirrors the iOS workflow. In stage 0 the target file doesn't
          # exist yet, so this is a no-op.
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("TMessagesProj/src/main/java/org/telegram/pampgram/phantomgiftkit/PampGramCasinoBridge.java")
          if not p.exists():
              print("casino bridge: target file not present yet (stage 0); nothing to fill.")
              raise SystemExit(0)
          s = p.read_text()
          url = os.environ.get("CASINO_BRIDGE_URL", "").strip().rstrip("/")
          tok = os.environ.get("CASINO_BRIDGE_TOKEN", "").strip()
          if url and tok and all(c.isalnum() or c in ":/.-_" for c in url) and tok.isalnum():
              s = s.replace('private static final String BASE_URL = "";', f'private static final String BASE_URL = "{url}";')
              s = s.replace('private static final String TOKEN = "";',    f'private static final String TOKEN = "{tok}";')
              p.write_text(s)
              print("casino bridge: enabled")
          else:
              print("casino bridge: off (secrets not set or not URL-safe)")
          PY

          ls -1 TMessagesProj/src/main/java/org/telegram/pampgram || true

      # Telegram-Android reads APP_ID / APP_HASH from
      # TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java.
      # Repo secrets TELEGRAM_API_ID / TELEGRAM_API_HASH are injected into the
      # build copy only; the public pair 8 / 7245de8e... is Telegram's own and
      # will have accounts limited if used by a third-party build.
      - name: Write build configuration
        working-directory: telegram-android
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '8' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '7245de8e747a0d6fbe11f7cc14fcc0bb' }}
          ALLOW_PUBLIC_API_KEYS: ${{ vars.ALLOW_PUBLIC_API_KEYS }}
        run: |
          set -euo pipefail

          if [ "$TELEGRAM_API_ID" = "8" ]; then
            if [ "$ALLOW_PUBLIC_API_KEYS" = "true" ]; then
              echo "WARNING: building with Telegram's public api_id 8 (ALLOW_PUBLIC_API_KEYS=true)."
              echo "Signing in to this build risks the account being limited."
            else
              echo "FAIL: secret TELEGRAM_API_ID is not set, so the build would fall back to"
              echo "Telegram's public api_id 8 and put the account at risk."
              echo "Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
              echo "To build with the public pair on purpose, set repo variable ALLOW_PUBLIC_API_KEYS=true."
              exit 1
            fi
          else
            API_ID="$(printf '%s' "$TELEGRAM_API_ID" | tr -d '[:space:]')"
            API_HASH="$(printf '%s' "$TELEGRAM_API_HASH" | tr -d '[:space:]')"
            if [[ ! "$API_ID" =~ ^[0-9]+$ ]]; then
              echo "FAIL: TELEGRAM_API_ID must be digits only."
              exit 1
            fi
            if [[ ! "$API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "FAIL: TELEGRAM_API_HASH is not a valid api_hash (expected 32 hex chars)."
              exit 1
            fi
            TELEGRAM_API_ID="$API_ID"
            TELEGRAM_API_HASH="$API_HASH"
            echo "OK: using your own api_id (${#API_ID} digits) and api_hash (32 hex)."
          fi

          BV=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          test -f "$BV" || { echo "FAIL: $BV not found"; exit 1; }
          # Patch APP_ID (int) and APP_HASH (String) in place. The upstream
          # declarations are "public static int APP_ID = ..." and
          # "public static String APP_HASH = \"...\"".
          python3 - <<PY
          import re, pathlib
          p = pathlib.Path("$BV")
          s = p.read_text()
          s = re.sub(r'(public\s+static\s+(?:final\s+)?int\s+APP_ID\s*=\s*)\d+', r'\g<1>${TELEGRAM_API_ID}', s)
          s = re.sub(r'(public\s+static\s+(?:final\s+)?String\s+APP_HASH\s*=\s*)"[^"]*"', r'\g<1>"${TELEGRAM_API_HASH}"', s)
          p.write_text(s)
          PY
          echo "BuildVars.java patched (values not printed)."

      # DrKLO/Telegram already ships a dummy release.keystore at
      # TMessagesProj/config/release.keystore, dummy google-services.json files
      # at every app module, and the matching RELEASE_* passwords in
      # gradle.properties (android/androidkey/android). So there is nothing to
      # provision — Gradle picks all of it up on its own. We only need to kick
      # off the build.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-telegram-android-${{ hashFiles('telegram-android/**/*.gradle', 'telegram-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-telegram-android-

      - name: Build APK (:TMessagesProj_AppStandalone:assembleAfatDebug)
        working-directory: telegram-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          # :TMessagesProj (the library) has no assemble task — the installable
          # apps live in sibling modules. :TMessagesProj_AppStandalone is the
          # sideload-oriented one (app id org.telegram.messenger.web, standalone
          # manifest). Its `afatDebug` variant is the universal multi-ABI APK
          # with no ProGuard, so it builds fast and is directly installable from
          # Android's "Install from unknown sources". For a production build
          # swap in `assembleAfatStandalone`, which turns ProGuard on.
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug

      - name: Show what was produced
        if: always()
        working-directory: telegram-android
        run: |
          echo "--- APK candidates ---"
          find TMessagesProj_AppStandalone/build/outputs/apk -type f -name '*.apk' -printf '%p\t%s bytes\n' || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PampGram-apk
          path: telegram-android/TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
